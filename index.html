<!doctype html>
<html lang="en">
  <head>
    <style>
      body {
        font-family: sans-serif;
        max-width: 400px;
        margin: 20px auto;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #28a745;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>CRM Lead Form</h2>
    <form id="leadForm">
      <input type="text" id="firstname" placeholder="First Name" required />
      <input type="text" id="lastname" placeholder="Last Name" required />
      <input type="text" id="address1_line1" placeholder="Address" />
      <input type="text" id="address1_city" placeholder="City" />
      <input
        type="text"
        id="address1_stateorprovince"
        placeholder="State (e.g. MA)"
      />
      <input type="text" id="address1_postalcode" placeholder="Postal Code" />
      <input
        type="tel"
        id="telephone2"
        placeholder="Phone Number (telephone2)"
      />
      <label>Birthdate:</label>
      <input type="date" id="birthdate" />
      <textarea id="description" placeholder="Description"></textarea>
      <button type="submit">Submit to CRM</button>
    </form>

    <script>
      document
        .getElementById("leadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Collect all fields
          const data = {
            firstname: document.getElementById("firstname").value,
            lastname: document.getElementById("lastname").value,
            address1_line1: document.getElementById("address1_line1").value,
            address1_city: document.getElementById("address1_city").value,
            address1_stateorprovince: document.getElementById(
              "address1_stateorprovince",
            ).value,
            address1_postalcode: document.getElementById("address1_postalcode")
              .value,
            telephone2: document.getElementById("telephone2").value,
            birthdate: document.getElementById("birthdate").value,
            description: document.getElementById("description").value,
          };

          const response = await fetch(
            "http://localhost:3000/api/submit-lead",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            },
          );

          const result = await response.json();
          if (result.success) {
            alert("Success! Contact Created in Dynamics 365.");
          } else {
            alert("Error: " + result.error);
          }
        });
    </script>
  </body>
</html>
